# Сгенерировано popug-bridges. Правки руками будут перезаписаны при следующем применении:
# маршруты меняются в панели, свои директивы — в настройках ноды.

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# Статистика клиентов по IP (панель читает её через stats-сокет).
backend st_clients
    stick-table type ipv6 size 200k expire 24h store conn_cur,conn_cnt,bytes_in_cnt,bytes_out_cnt,bytes_in_rate(1m),bytes_out_rate(1m)

# Общий потолок скорости маршрута: ключ — имя бэкенда, лимит делят все клиенты маршрута на этой ноде.
backend st_route_bw
    stick-table type string len 32 size 1k expire 10m store bytes_in_rate(1s),bytes_out_rate(1s)

# TLS не терминируем: читаем SNI из ClientHello и по карте отправляем на нужный выход.
frontend fe_sni
    bind :443
    tcp-request inspect-delay 5s
    tcp-request connection track-sc2 src table st_clients
    filter bwlim-out route_dl_de limit 1000000 key str(be_de) table st_route_bw
    filter bwlim-in route_ul_de limit 1000000 key str(be_de) table st_route_bw
    tcp-request content set-bandwidth-limit route_dl_de if { req.ssl_sni,lower,map(/etc/haproxy/maps/sni.map) -m str be_de }
    tcp-request content set-bandwidth-limit route_ul_de if { req.ssl_sni,lower,map(/etc/haproxy/maps/sni.map) -m str be_de }
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend %[req.ssl_sni,lower,map(/etc/haproxy/maps/sni.map)]
    default_backend be_reject

# Неизвестный SNI и не-TLS трафик: закрываем соединение.
backend be_reject
    tcp-request content reject

# Германия
backend be_de
    server de1 198.51.100.10:443 check inter 10s fall 3 rise 2

# Швеция
backend be_se
    server se1 198.51.100.10:443 check inter 10s fall 3 rise 2
